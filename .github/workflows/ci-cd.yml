name: CI/CD Pipeline

# WHEN does this pipeline run?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------- CI: Continuous Integration ----------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode verify

      - name: Save the built jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ---------- CD: Continuous Delivery/Deployment ----------
  deploy:
    needs: build-and-test            # runs only if the CI job passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download the built jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Run the app (smoke test)
        run: java -jar simple-cicd-1.0.0.jar

      - name: Deploy (simulated)
        run: echo "Deploying simple-cicd-1.0.0.jar to a server... (replace this step with a real deploy)"
